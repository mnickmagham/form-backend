<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سامانه مدیریت اطلاعات دانشجویان</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="cap" aria-hidden="true">🎓</span>
      <h1>سامانه مدیریت اطلاعات دانشجویان</h1>
    </div>
    <nav>
      <a class="active" href="#">خانه</a>
      <a href="#">درباره</a>
    </nav>
  </header>

  <main class="layout">
    <section class="panel form-panel">
      <h2><span class="person-icon" aria-hidden="true">👤</span> ثبت اطلاعات دانشجو</h2>
      <form id="student-form">
        <label for="student-id">شماره دانشجویی</label>
        <input id="student-id" type="text" placeholder="مثال: 1405123">

        <label for="student-name">نام و نام خانوادگی</label>
        <input id="student-name" type="text" placeholder="مثال: علی محمدی">

        <label for="major">رشته تحصیلی</label>
        <select id="major">
          <option value="">انتخاب رشته</option>
          <option>مهندسی کامپیوتر</option>
          <option>مهندسی برق</option>
          <option>مهندسی مکانیک</option>
          <option>مدیریت صنعتی</option>
          <option>علوم کامپیوتر</option>
        </select>

        <label for="degree">مقطع تحصیلی</label>
        <select id="degree">
          <option value="">انتخاب مقطع</option>
          <option>کاردانی</option>
          <option>کارشناسی</option>
          <option>کارشناسی ارشد</option>
          <option>دکتری</option>
        </select>

        <label for="phone">شماره تماس</label>
        <input id="phone" type="tel" placeholder="مثال: 09123456789">

        <button type="submit" id="submit-btn" class="submit-btn">ثبت اطلاعات <span>＋</span></button>
      </form>
      <button type="button" id="cancel-edit-btn" hidden>لغو ویرایش</button>
      <div id="form-message" class="status-message"></div>
    </section>

    <section class="panel table-panel">
      <h2><span class="search-icon" aria-hidden="true">⌕</span> جستجوی دانشجو</h2>
      <div class="search-row">
        <input id="search-input" type="search" placeholder="نام، شماره دانشجویی یا رشته را وارد کنید...">
        <button type="button" id="search-btn">جستجو</button>
      </div>

      <div class="controls-row">
        <div class="control-group filter-group">
          <label for="filter-field">فیلتر بر اساس</label>
          <select id="filter-field">
            <option value="">هیچ کدام</option>
            <option value="student_id">شماره دانشجویی</option>
            <option value="name">نام</option>
            <option value="last_name">نام خانوادگی</option>
            <option value="major">رشته تحصیلی</option>
            <option value="degree">مقطع تحصیلی</option>
            <option value="phone_number">شماره تماس</option>
          </select>
          <input id="filter-value" type="search" placeholder="مقدار را بنویسید...">
          <button type="button" id="clear-filter" class="text-btn">پاک کردن فیلتر</button>
        </div>

        <div class="control-group sort-group">
          <label for="sort-field">مرتب‌سازی</label>
          <select id="sort-field">
            <option value="id">شناسه (جدیدترین)</option>
            <option value="student_id">شماره دانشجویی</option>
            <option value="name">نام</option>
            <option value="major">رشته تحصیلی</option>
          </select>
          <select id="sort-order">
            <option value="ASC">صعودی</option>
            <option value="DESC">نزولی</option>
          </select>
        </div>
      </div>

      <div class="table-wrap loading" id="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ردیف</th>
              <th>شماره دانشجویی</th>
              <th>نام و نام خانوادگی</th>
              <th>رشته تحصیلی</th>
              <th>مقطع</th>
              <th>شماره تماس</th>
              <th>عملیات</th>
            </tr>
          </thead>
          <tbody id="students-tbody">
          </tbody>
        </table>
        <div id="table-loader" class="table-loader"><span class="spinner"></span> در حال بارگذاری اطلاعات...</div>
      </div>

      <div class="pagination">
        <button type="button" id="prev-page" disabled>قبلی</button>
        <span id="page-indicator">۱ از ۱</span>
        <button type="button" id="next-page">بعدی</button>
      </div>

      <div id="table-error" class="status-message error" hidden></div>
    </section>

    <div id="toast-container" aria-live="polite"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
