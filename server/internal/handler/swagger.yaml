definitions:
  store.Student:
    properties:
      degree:
        type: string
      id:
        type: integer
      last_name:
        type: string
      major:
        type: string
      name:
        type: string
      phone_number:
        type: string
      student_id:
        type: string
    type: object
info:
  contact: {}
paths:
  /students:
    get:
      description: Search students by query (q) across name, last_name, student_id,
        major, or filter by individual fields. Supports pagination and sorting.
      parameters:
      - description: Global search term
        in: query
        name: q
        type: string
      - description: Filter by student_id
        in: query
        name: student_id
        type: string
      - description: Filter by name
        in: query
        name: name
        type: string
      - description: Filter by last_name
        in: query
        name: last_name
        type: string
      - description: Filter by major
        in: query
        name: major
        type: string
      - description: Filter by degree
        in: query
        name: degree
        type: string
      - description: Filter by phone_number
        in: query
        name: phone_number
        type: string
      - description: Sort column (default id)
        in: query
        name: sortBy
        type: string
      - description: Sort order ASC or DESC (default ASC)
        in: query
        name: sortOrder
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 10)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: students list with total, page, limit
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid pagination params
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Search students
      tags:
      - students
    post:
      consumes:
      - application/json
      description: Create a new student record. student_id, name and last_name are
        required.
      parameters:
      - description: student data
        in: body
        name: student
        required: true
        schema:
          $ref: '#/definitions/store.Student'
      produces:
      - application/json
      responses:
        "201":
          description: created student
          schema:
            $ref: '#/definitions/store.Student'
        "400":
          description: validation failed or invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: student already registered
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new student
      tags:
      - students
  /students/{id}:
    delete:
      description: Delete an existing student record by ID.
      parameters:
      - description: student ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: student deleted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid student id
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: student not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a student
      tags:
      - students
    get:
      description: Retrieve a single student record by its ID.
      parameters:
      - description: student ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: student record
          schema:
            $ref: '#/definitions/store.Student'
        "400":
          description: invalid student id
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: student not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a student by ID
      tags:
      - students
    put:
      consumes:
      - application/json
      description: Update an existing student record by ID.
      parameters:
      - description: student ID
        in: path
        name: id
        required: true
        type: integer
      - description: updated student data
        in: body
        name: student
        required: true
        schema:
          $ref: '#/definitions/store.Student'
      produces:
      - application/json
      responses:
        "200":
          description: updated student
          schema:
            $ref: '#/definitions/store.Student'
        "400":
          description: validation failed or invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: student not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a student
      tags:
      - students
swagger: "2.0"
